apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: baremetal-node-alerts
  namespace: monitoring-ns    # matches Prometheus
spec:
  groups:
  - name: baremetal.rules
    rules:
    - alert: NodeDown
      expr: up{job="baremetal-node-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node down: {{ $labels.instance }}"
        description: "{{ $labels.instance }} has been unreachable for 2 minutes."
